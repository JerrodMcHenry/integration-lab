[pytest]
testpaths = tests
# Dump every thread's stack if a single test runs longer than this (diagnoses hangs).
faulthandler_timeout = 120
markers =
    postgres: needs a real PostgreSQL database (TEST_DATABASE_URL); skipped if unreachable unless REQUIRE_POSTGRES=1
filterwarnings =
    ignore:You should not use the 'timeout' argument with the TestClient
    ignore:Using `httpx` with `starlette.testclient` is deprecated
