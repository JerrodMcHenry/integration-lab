# IntegrationLab local development stack.
#
# Every published port is bound to 127.0.0.1, so nothing is reachable from
# other machines. PostgreSQL credentials come from .env (gitignored); compose
# refuses to start if POSTGRES_PASSWORD is unset. No host bind mounts are used
# (Docker Desktop on macOS can block on folder-access prompts for ~/Documents).
# The integration test database is created by the test fixtures.
name: integrationlab

x-app: &app
  build: .
  image: integrationlab-app:local
  env_file: .env
  environment: &app-env
    APP_ENV: development
    DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-integrationlab}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-integrationlab}
    CRM_BASE_URL: http://mock-crm:8001
    INTERNAL_API_BASE_URL: http://mock-cms:8002

services:
  db:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-integrationlab}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-integrationlab}
    ports:
      # Localhost only. 5434 avoids clashing with other local Postgres instances.
      - "127.0.0.1:${POSTGRES_HOST_PORT:-5434}:5432"
    volumes:
      # postgres:18 images keep data under /var/lib/postgresql/<major>/; mount the parent.
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 2s
      timeout: 3s
      retries: 30

  migrate:
    <<: *app
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  mock-crm:
    <<: *app
    command: ["uvicorn", "mock_crm.main:app", "--host", "0.0.0.0", "--port", "8001"]
    ports:
      - "127.0.0.1:8001:8001"

  mock-cms:
    <<: *app
    command: ["uvicorn", "mock_internal.main:app", "--host", "0.0.0.0", "--port", "8002"]
    ports:
      - "127.0.0.1:8002:8002"

  api:
    <<: *app
    # Several worker processes, so the cross-process advisory lock is exercised in normal use.
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--workers", "4"]
    ports:
      - "127.0.0.1:8000:8000"
    depends_on:
      migrate:
        condition: service_completed_successfully
      mock-crm:
        condition: service_started
      mock-cms:
        condition: service_started

volumes:
  pgdata:
