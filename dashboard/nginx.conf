# Same-origin setup: the browser only talks to this server, so the API needs no CORS.
server {
    listen 8080;
    server_tokens off;

    # Resolve upstream names per request via Docker's embedded DNS. A literal
    # hostname in proxy_pass is resolved once at startup, so a recreated api or
    # mock-idp container with a new IP would get 502s until nginx restarted.
    # Using a variable in proxy_pass makes nginx re-resolve (cached for 10 s).
    resolver 127.0.0.11 valid=10s ipv6=off;

    location /api/ {
        set $api_upstream http://api:8000;
        rewrite ^/api/(.*)$ /$1 break;   # strip the /api prefix (query string is kept)
        proxy_pass $api_upstream;
        proxy_set_header Host $host;
    }

    # The mock IdP's login page sets its own security headers.
    location /idp/ {
        set $idp_upstream http://mock-idp:8090;
        rewrite ^/idp/(.*)$ /$1 break;   # strip the /idp prefix (query string is kept)
        proxy_pass $idp_upstream;
        proxy_set_header Host $host;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;   # /callback is handled by the app
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;
    }
}
