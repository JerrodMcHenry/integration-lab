# Same-origin setup: the browser only talks to this server, so the API needs no CORS.
server {
    listen 8080;
    server_tokens off;

    location /api/ {
        proxy_pass http://api:8000/;   # trailing slash strips the /api prefix
        proxy_set_header Host $host;
    }

    # The mock IdP's login page sets its own security headers.
    location /idp/ {
        proxy_pass http://mock-idp:8090/;
        proxy_set_header Host $host;
    }

    location / {
        root /usr/share/nginx/html;
        try_files $uri /index.html;   # /callback is handled by the app
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none'; base-uri 'none'; form-action 'self'" always;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        add_header Cache-Control no-store always;
    }
}
